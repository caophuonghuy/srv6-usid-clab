name: srv6-uSID-lab
prefix: ""
mgmt:
  network: mngt
  ipv4-subnet: 172.50.50.0/24

topology:
  kinds:
    nokia_srsim:
      image: localhost/nokia/srsim:25.7.R1
      license: /home/License/SR-SIM/srsim-r25.txt
      type: sr-1x-48d
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d2l

  nodes:

# P routers
    srv6-p1:
      kind: nokia_srsim
      mgmt-ipv4: 172.50.50.31
      ports:
        - 2031:22
      startup-config: ./configs/srv6-p1.txt

    srv6-p2:
      kind: nokia_srsim
      mgmt-ipv4: 172.50.50.32
      startup-config: ./configs/srv6-p2.txt

    srv6-p3:
      kind: nokia_srsim
      mgmt-ipv4: 172.50.50.33
      ports:
        - 2033:22
      startup-config: ./configs/srv6-p3.txt

    srv6-p4:
      kind: nokia_srsim
      mgmt-ipv4: 172.50.50.34
      ports:
        - 2034:22
      startup-config: ./configs/srv6-p4.txt

# PE routers
    srv6-pe5:
      kind: nokia_srsim
      mgmt-ipv4: 172.50.50.35
      ports:
        - 2035:22
      startup-config: ./configs/srv6-pe5.txt

    srv6-pe6:
      kind: nokia_srsim
      mgmt-ipv4: 172.50.50.36
      ports:
        - 2036:22
      startup-config: ./configs/srv6-pe6.txt

    srv6-pe7:
      kind: nokia_srsim
      mgmt-ipv4: 172.50.50.37
      ports:
        - 2037:22
      startup-config: ./configs/srv6-pe7.txt

    srv6-pe8:
      kind: nokia_srsim
      mgmt-ipv4: 172.50.50.38
      ports:
        - 2038:22
      startup-config: ./configs/srv6-pe8.txt

# Computer - CE
    srv6-pc9:
      kind: nokia_srlinux
      mgmt-ipv4: 172.50.50.39
      ports:
        - 2039:22

    srv6-pc10:
      kind: nokia_srlinux
      mgmt-ipv4: 172.50.50.40
      ports:
        - 2040:22

    srv6-pc11:
      kind: nokia_srlinux
      mgmt-ipv4: 172.50.50.41
      ports:
        - 2041:22

    srv6-pc12:
      kind: nokia_srlinux
      mgmt-ipv4: 172.50.50.42
      ports:
        - 2042:22
  links:
    # Core links
    - endpoints: ["srv6-p1:1/1/c1/2", "srv6-p2:1/1/c1/1"]
    - endpoints: ["srv6-p1:1/1/c3/1", "srv6-p3:1/1/c1/1"]
    - endpoints: ["srv6-p1:eth4", "srv6-p4:eth1"]
    - endpoints: ["srv6-p2:eth3", "srv6-p3:eth2"]
    - endpoints: ["srv6-p2:eth4", "srv6-p4:eth2"]
    - endpoints: ["srv6-p3:eth4", "srv6-p4:eth3"]
    # PE links
    - endpoints: ["srv6-pe5:eth1", "srv6-p1:eth5"]
    - endpoints: ["srv6-pe6:eth2", "srv6-p2:eth6"]
    - endpoints: ["srv6-pe5:eth7", "srv6-pe7:eth5"]
    - endpoints: ["srv6-pe7:eth3", "srv6-p3:eth7"]
    - endpoints: ["srv6-pe8:eth4", "srv6-p4:eth8"]
    - endpoints: ["srv6-pe6:eth8", "srv6-pe8:eth6"]
    #CE links to SRL nodes
    - endpoints: ["srv6-pe5:eth9", "srv6-pc9:e1-1"]
    - endpoints: ["srv6-pe6:eth9", "srv6-pc10:e1-1"]
    - endpoints: ["srv6-pe7:eth9", "srv6-pc11:e1-1"]
    - endpoints: ["srv6-pe8:eth9", "srv6-pc12:e1-1"]

